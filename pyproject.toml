[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-spherical-vae"
version = "0.1.0"
description = "Horizontal wrapped-context decoding utilities for equirectangular H3 video"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools]
py-modules = ["circular_decode", "spherical_context", "periodic_tiles"]
